<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EarthEye OC</title>
    <script>
      // SPA fallback for GitHub Pages: remember the deep link, go to root.
      try {
        sessionStorage.setItem(
          "ee-redirect-path",
          window.location.pathname + window.location.search + window.location.hash
        );
      } catch (e) {}
      window.location.replace("/PLUR/");
    </script>
  </head>
  <body style="background:#0F0F0D"></body>
</html>
